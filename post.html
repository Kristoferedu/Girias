<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Gíria Online!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1D2D44">
    <style>
        /* Estilos específicos para leitura de texto */
        .post-content { line-height: 1.8; font-size: 1.1em; color: #333; margin-top: 20px; }
        .post-content p { margin-bottom: 20px; }
        .post-header { border-bottom: 4px solid var(--accent-color); padding-bottom: 20px; margin-bottom: 30px; }
        .post-meta { color: #666; font-size: 0.9em; margin-top: 10px; }
        .post-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 25px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--secondary-color); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="color: inherit; text-decoration: none;">Gíria Online!</a></h1>
        <nav>
            <ul>
                <li><a href="/#destaques">Gírias</a></li>
                <li><a href="/blog.html">Blog</a></li> 
            
            </ul>
        </nav>
    </header> 

    <div class="container" style="display: block; max-width: 800px;"> <!-- Layout centralizado para leitura -->
        <main style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <a href="/blog.html" class="back-link">← Voltar para o Blog</a>
            
            <div id="loading">Carregando artigo...</div>
            
            <article id="article-container" style="display: none;">
                <!-- Imagem de Capa -->
                <img id="post-img" class="post-img" style="display: none;">
                
                <div class="post-header">
                    <h1 id="post-title" style="font-size: 2.5em; color: var(--primary-color); margin: 0;"></h1>
                    <div class="post-meta">
                        Por <strong id="post-author"></strong> • <span id="post-date"></span>
                    </div>
                </div>

                <div id="post-body" class="post-content"></div>
            </article>
        </main>
    </div>

<footer style="text-align: center;">
    <p>&copy; 2026 Gíria Online! - Todos os direitos reservados.</p>
    <div style="font-size: 0.85em; margin-top: 10px; opacity: 0.7;">
        <a href="/termos.html" style="color: inherit; text-decoration: none; margin: 0 5px;">Termos de Uso</a> | 
        <a href="/privacidade.html" style="color: inherit; text-decoration: none; margin: 0 5px;">Política de Privacidade</a> | 
    <a href="/novidades.html" style="color: inherit; text-decoration: none; margin: 0 5px;">Novidades</a>
    </div>
</footer>

    <script src="script.js" defer></script> 
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('✅ Modo Offline ativado!', reg.scope))
                .catch(err => console.log('❌ Falha no Service Worker:', err));

     </script>
     <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
        });
    }
</script>
 </body>
</html>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.db === 'undefined') return console.error("Erro no Supabase");

            // 1. Pega o SLUG da URL (ex: ?slug=minha-noticia)
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                document.getElementById('loading').innerHTML = "Artigo não encontrado.";
                return;
            }

            // 2. Busca no Banco
            const { data, error } = await window.db
                .from('posts')
                .select('*')
                .eq('slug', slug)
                .single();

            if (error || !data) {
                document.getElementById('loading').innerHTML = "Ops! Esse artigo não existe ou foi removido.";
                return;
            }

            // 3. Preenche a tela
            document.getElementById('loading').style.display = 'none';
            document.getElementById('article-container').style.display = 'block';
            
            document.title = `${data.titulo} | Gíria Online`;
            document.getElementById('post-title').textContent = data.titulo;
            document.getElementById('post-author').textContent = data.autor || 'Equipe';
            document.getElementById('post-date').textContent = new Date(data.created_at).toLocaleDateString('pt-BR');
            
            // Formata o conteúdo (quebra de linha vira parágrafo)
            // Se você quiser aceitar HTML no futuro, mudaria para innerHTML
            document.getElementById('post-body').innerText = data.conteudo; 

            if (data.imagem_url) {
                const img = document.getElementById('post-img');
                img.src = data.imagem_url;
                img.style.display = 'block';
            }
        });
    </script>
</body>
</html>
