<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novidades - Gíria Online!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .timeline { max-width: 800px; margin: 40px auto; position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: var(--border); border-radius: 2px; }
        .news-item { background: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .news-item::after { content: ''; position: absolute; left: -38px; top: 30px; width: 16px; height: 16px; background: var(--accent-color); border: 4px solid var(--bg-body); border-radius: 50%; }
        .news-date { font-size: 0.85em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .news-item h2 { border: none; margin: 10px 0; font-size: 1.5em; padding: 0; display: flex; align-items: center; gap: 10px; }
        .news-icon-circle { background: #f0f4f8; padding: 10px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="color: inherit; text-decoration: none;">Gíria Online!</a></h1>
        <p>Evolução da nossa plataforma</p>
        <nav>
            <ul>
                <li><a href="/#sobre">Sobre</a></li>
                <li><a href="/#destaques">Gírias</a></li>
                <li><a href="/#categorias">Categorias</a></li>
                <li><a href="/blog.html">Blog de Gírias</a></li> 
                <li><a href="/#adicionar">Adicionar</a></li>
                <li><a href="/#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <main>
            <section>
                <h2>Linha do Tempo 🛠️</h2>
                <div id="timeline-container" class="timeline">
                    <p id="loading">Carregando novidades...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('timeline-container');
            
            // Verifica se o banco carregou
            if (!window.db) {
                container.innerHTML = "<p>Erro ao conectar ao banco de dados.</p>";
                return;
            }

            const { data, error } = await window.db
                .from('plataforma_novidades')
                .select('*')
                .eq('status', 'publicado')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                container.innerHTML = "<p>Erro ao carregar novidades.</p>";
                return;
            }

            if (data && data.length > 0) {
                container.innerHTML = '';
                data.forEach(item => {
                    const date = new Date(item.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric'});
                    container.innerHTML += `
                        <div class="news-item">
                            <span class="news-date">${date}</span>
                            <h2><span>${item.icone || '🚀'}</span> ${item.titulo}</h2>
                            <p>${item.descricao}</p>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = "<p>Nenhuma novidade registrada ainda.</p>";
            }
        });
    </script>
</body>
</html>
