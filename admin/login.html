<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Login</title>
    <link rel="stylesheet" href="/admin/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1>🔐 Painel Admin</h1>
        <p class="subtitle">Acesse para moderar as gírias enviadas.</p>
        <form id="login-form">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="admin@exemplo.com" required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Sua senha" required>

            <button type="submit">Entrar</button>
            <p id="form-message" class="status-text"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/supabase-config.js" defer></script>
    <script src="/admin/login.js" defer></script>
</body>
</html>
