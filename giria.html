<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Carregando Gíria... | Gíria Online!</title>
    <meta name="description" content="Descubra o significado, origem e como usar as gírias mais populares do Brasil.">
    
    <link rel="preload" href="https://fonts.gstatic.com/s/poppins/v20/pxiByp8kv8JvZF5SJlZfFQ.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1><a href="/" style="color: inherit; text-decoration: none;">Gíria Online!</a></h1>
        <p>O seu dicionário de gírias vivo e colaborativo</p>
        <nav>
            <ul>
                <li><a href="/#sobre">Sobre</a></li>
                <li><a href="/#destaques">Gírias</a></li>
                <li><a href="/#categorias">Categorias</a></li>
                <li><a href="/blog.html">Blog de Gírias</a></li> 
                <li><a href="/#adicionar">Adicionar</a></li>
                <li><a href="/#contato">Contato</a></li>
            </ul>
        </nav>
        <div class="search-container">
            <div class="search-wrapper">
                <input type="search" placeholder="Buscar por gíria ou significado..." id="search-giria" autocomplete="on">
                <div id="suggestions-container"></div>
            </div>
            <button id="search-button">Buscar</button>
        </div>
    </header> 

    <div class="container">
        <main>
            <section id="giria-detalhe-container">
                <h2>Carregando...</h2>
            </section>
        </main>
        <aside>
            <div class="site-stats">
                <h3>Gírias Cadastradas</h3>
                <p id="girias-count">0</p>
            </div>
            <div class="giria-do-dia">
                <h3>Gíria do Dia ✨</h3>
                <p><strong id="giria-do-dia-nome">Carregando...</strong></p>
                <p><em>Significado: <span id="giria-do-dia-significado"></span></em></p>
                <p><em>Categoria: <span id="giria-do-dia-categoria"></span></em></p>
            </div>
        </aside>
        
    </div>

    <footer>
        <p>&copy; 2025 Gíria Online! - Todos os direitos reservados.</p>
    </footer>
    
    <!-- O modal da página inicial é necessário aqui para a busca funcionar -->
    <div id="giriaModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-giria-nome"></h2>
            <p id="modal-giria-significado"></p>
            <p><span id="modal-giria-categoria"></span></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/supabase-config.js" defer></script>
    <!-- MUDANÇA: Agora esta página usa apenas o giria.js, que será mais poderoso -->
    <script src="/giria.js" defer></script> 
</body>
</html>
